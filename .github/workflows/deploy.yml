name: Deploy to GitHub Pages

on:
  # Manual start only, until Impressum/Datenschutz are filled in.
  # Later add:  push: { branches: [main] }
  workflow_dispatch:

# Only the rights this workflow needs: read the code, publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # same major version as local development
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
